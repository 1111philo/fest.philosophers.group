<style>

    --surface: #ffffff;

      --surface-2: #2a2115;

      --text-muted: #b3a48d;
      --border: #3a2f1f;
      --accent: #d9a94e;
      --accent-soft: #3a2c14;
      --accent-contrast: #211505;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 2px 12px rgba(0, 0, 0, 0.25);

      --badge-workshop: #7fbf9e;
      --badge-workshop-bg: #1c2c22;
      --badge-panel: #8fb3d9;
      --badge-panel-bg: #1c2632;
      --badge-fireside: #d99aa0;
      --badge-fireside-bg: #2e1c1e;
      --badge-party: #d996b8;
      --badge-party-bg: #2e1c27;
      --badge-food: #d9bf6f;
      --badge-food-bg: #2c2717;
      --badge-info: #b8ad98;
      --badge-info-bg: #241f16;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: Archivo, system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
  button { font-family: inherit; }

  a { color: var(--accent); }

  .header {
    position: relative;
    padding: 20px 20px 16px;
    text-align: left;

  }
  .header-top {

  .header h1 {

    margin: 0;
    text-wrap: balance;
  }
  .header .subtitle {
    margin-top: 8px;
    font-size: clamp(13px, 2.6vw, 16px);
    color: var(--accent);
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .hamburger-btn {
    flex-shrink: 0;
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;

    border: 1px solid var(--border);

    cursor: pointer;
  }
  .hamburger-btn:hover { background: var(--surface-2); }
  .hamburger-icon, .hamburger-icon::before, .hamburger-icon::after {
    display: block;
    width: 16px;

  }
  .hamburger-icon { position: relative; }
  .hamburger-icon::before, .hamburger-icon::after { content: ""; position: absolute; left: 0; }
  .hamburger-icon::before { top: -5px; }
  .hamburger-icon::after { top: 5px; }

  .site-menu {

    top: 100%;
    left: 20px;

    box-shadow: var(--shadow);
    overflow: hidden;
    z-index: 20;
    display: flex;
    flex-direction: column;
  }
  .site-menu button, .site-menu a {

    padding: 11px 16px;
    text-align: left;
    background: none;
    border: none;
    border-top: 1px solid var(--border);
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
  }
  .site-menu button:first-child { border-top: none; }
  .site-menu button:hover, .site-menu a:hover { background: var(--surface-2); }

  .toolbar {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .year-dropdown { position: relative; flex-shrink: 0; }
  .year-toggle {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 9px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;

  .year-toggle:hover { background: var(--surface-2); }

  .year-menu {
    position: absolute;
    top: 100%;
    left: 0;
    margin-top: 6px;

    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;

    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 9px 12px;
    background: none;
    border: none;

    border-radius: 10px;

    color: var(--text);
    font-size: 14px;
    font-family: inherit;

    padding: 12px 14px;
    background: var(--surface);
    border: 1px solid var(--border);

  .card-meta { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
  .day-header {
    font-family: Fraunces, Georgia, serif;
    font-weight: 600;

    margin: 22px 0 10px;

  .badge {
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;

  .badge.loc { background: var(--surface-2); color: var(--text-muted); }
  .badge.type-workshop { background: var(--badge-workshop-bg); color: var(--badge-workshop); }
  .badge.type-panel { background: var(--badge-panel-bg); color: var(--badge-panel); }
  .badge.type-fireside-chat { background: var(--badge-fireside-bg); color: var(--badge-fireside); }
  .badge.type-party { background: var(--badge-party-bg); color: var(--badge-party); }
  .badge.type-food { background: var(--badge-food-bg); color: var(--badge-food); }
  .badge.type-informational { background: var(--badge-info-bg); color: var(--badge-info); }

  .empty-state { text-align: center; color: var(--text-muted); padding: 60px 20px; font-size: 14px; }

  /* Modal */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(20, 14, 4, 0.5);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 100;
    padding: 0;
  }
  .modal {
    position: relative;
    background: var(--bg);
    width: 100%;
    max-width: 640px;
    max-height: 88vh;
    overflow-y: auto;
    border-radius: 18px 18px 0 0;
    padding: 20px 22px calc(28px + env(safe-area-inset-bottom, 0px));
    box-shadow: 0 -4px 24px rgba(0,0,0,0.25);

  @media (min-width: 640px) {

  .modal-close {
    position: absolute;
    top: 14px;
    right: 14px;
    z-index: 1;
    background: var(--surface-2);
    border: none;
    color: var(--text);

    height: 30px;
    border-radius: 999px;
    font-size: 16px;
    cursor: pointer;
    line-height: 1;

    font-size: 21px;

  .modal-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .presenter-card {
    display: flex;
    gap: 14px;
    align-items: flex-start;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 16px;

  .presenter-card img {
    width: 60px; height: 60px; border-radius: 10px; object-fit: cover; flex-shrink: 0;

  .presenter-name { font-weight: 700; font-size: 14px; margin-bottom: 3px; }
  .presenter-bio { font-size: 12.5px; color: var(--text-muted); line-height: 1.55; position: relative; }
  .presenter-bio.collapsed { max-height: 4.65em; overflow: hidden; }
  .presenter-bio.collapsed::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 1.5em;
    background: linear-gradient(to bottom, transparent, var(--surface));
  }
  .bio-toggle {
    display: inline-block;
    margin-top: 7px;
    background: none;
    border: none;
    padding: 0;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    cursor: pointer;
  }
  .bio-toggle:hover, .bio-toggle:focus-visible { text-decoration: underline; }
  .bio-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .modal-hero { width: 100%; max-height: 280px; object-fit: cover; border-radius: 12px; margin-bottom: 14px; background: var(--surface-2); }

  .wp-content { font-size: 14.5px; line-height: 1.65; }
  .wp-content :is(h1,h2,h3,h4) { text-wrap: balance; margin-top: 1.3em; font-family: Fraunces, Georgia, serif; }
  .wp-content p { margin: 0.85em 0; }
  .wp-content img { max-width: 100%; border-radius: 8px; height: auto; }
  .wp-content table { overflow-x: auto; display: block; }

  .live-link { display: inline-block; margin-top: 16px; font-size: 12.5px; font-weight: 600; }

  /* Drawer - presentations/schedule items open here instead of a blocking
     modal, so you can keep browsing the schedule behind it. On desktop it
     docks to the right without dimming the page (pointer-events pass
     through everywhere except the panel itself); below that width there's
     no room to show both, so it becomes the same kind of bottom sheet the
     modal uses, dimmed backdrop included. */
  .drawer-backdrop {
    position: fixed;
    inset: 0;
    z-index: 90;
    background: transparent;
    pointer-events: none;
    display: flex;
    align-items: stretch;
    justify-content: flex-end;
  }
  .drawer {
    pointer-events: auto;
    position: relative;
    background: var(--bg);
    width: 460px;
    max-width: 100%;
    height: 100%;
    overflow-y: auto;
    border-left: 1px solid var(--border);
    padding: 20px 22px calc(28px + env(safe-area-inset-bottom, 0px));
    box-shadow: -4px 0 24px rgba(0,0,0,0.12);
  }
  @media (max-width: 767px) {
    .drawer-backdrop {
      background: rgba(20, 14, 4, 0.5);
      pointer-events: auto;
      align-items: flex-end;
      justify-content: center;
    }
    .drawer {
      width: 100%;
      max-width: 640px;
      max-height: 88vh;
      border-left: none;
      border-radius: 18px 18px 0 0;
      box-shadow: 0 -4px 24px rgba(0,0,0,0.25);
    }
  }
  @media (min-width: 768px) {
    /* Reserve the drawer's width instead of letting it cover the schedule,
       so cards/tabs on the right aren't hidden behind it while it's open. */
    body.drawer-open .header,
    body.drawer-open .toolbar,
    body.drawer-open main {
      margin-right: 460px;
    }
  }

  .photo-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 8px;
    margin: 16px 0;
  }
  .photo-grid img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; }
  .about-p { font-size: 14.5px; line-height: 1.65; }
  .about-p:first-of-type { font-size: 16px; font-weight: 600; }

  .site-footer {
    max-width: 1000px;
    margin: 0 auto;
    padding: 26px 16px calc(30px + env(safe-area-inset-bottom, 0px));
    text-align: center;
    font-size: 12.5px;
    color: var(--text-muted);
    border-top: 1px solid var(--border);
  }
  .site-footer a { color: var(--text-muted); text-decoration: underline; }
  .site-footer a:hover { color: var(--accent); }
</style>

<script>
(function () {
  "use strict";

  var state = { data: null, year: "2026", day: "all", query: "", mediaById: {}, scheduleCache: {} };

  var elMain = document.getElementById("main");
  var elDayTabs = document.getElementById("day-tabs");
  var elSearch = document.getElementById("search");
  var elModalRoot = document.getElementById("modal-root");
  var elDrawerRoot = document.getElementById("drawer-root");
  var elHamburgerBtn = document.getElementById("hamburger-btn");
  var elSiteMenu = document.getElementById("site-menu");
  var elYearToggle = document.getElementById("year-toggle");
  var elYearToggleLabel = document.getElementById("year-toggle-label");
  var elYearMenu = document.getElementById("year-menu");

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function typeSlug(type) {
    return (type || "").toLowerCase().trim().replace(/\s+/g, "-");
  }

  function stripTags(html) {
    var d = document.createElement("div");
    d.innerHTML = html || "";
    return (d.textContent || "").trim();
  }

  var WEEKDAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];

  // Presentations from years before the CSV-based schedule (2024/2025) only
  // have their own scraped "M/D/YYYY" or "M/D/YY" date + "H:MM AM/PM" time -
  // parse those into the same {date, sort_time, day} shape the 2026 schedule
  // rows already have, so both render through the same code.
  function parseUsDate(s) {
    var m = /^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/.exec((s || "").trim());
    if (!m) return null;
    var month = Number(m[1]), day = Number(m[2]), year = Number(m[3]);
    if (year < 100) year += 2000;
    var d = new Date(year, month - 1, day);
    if (isNaN(d.getTime())) return null;
    return {
      iso: year + "-" + String(month).padStart(2, "0") + "-" + String(day).padStart(2, "0"),
      dow: WEEKDAYS[d.getDay()]
    };
  }
  function parseDisplayTime(s) {
    var m = /^(\d{1,2}):(\d{2})\s*(AM|PM)$/i.exec((s || "").trim());
    if (!m) return null;
    var hour = Number(m[1]) % 12;
    if (m[3].toUpperCase() === "PM") hour += 12;
    return String(hour).padStart(2, "0") + ":" + m[2];
  }

  function getAvailableYears() {
    var years = {};
    (state.data.schedule || []).forEach(function (s) { years[s.year] = true; });
    var yearTagRe = /^NOAI (\d{4}) Presentation$/;
    (state.data.tags || []).forEach(function (t) {
      var m = yearTagRe.exec(t.name);
      if (m) years[m[1]] = true;
    });
    return Object.keys(years).sort().reverse();
  }

  // Unifies the rich, CSV-sourced 2026 schedule with a schedule synthesized
  // from presentations[] for other years (which only have their own
  // scraped date/time/location - no logistics-only slots, no type/tag).
  function getScheduleForYear(year) {
    if (state.scheduleCache[year]) return state.scheduleCache[year];

    var rows = (state.data.schedule || []).filter(function (s) { return s.year === year; });
    if (!rows.length) {
      var yearTag = (state.data.tags || []).find(function (t) { return t.name === "NOAI " + year + " Presentation"; });
      if (yearTag) {
        (state.data.presentations || []).forEach(function (p) {
          if ((p.tags || []).indexOf(yearTag.id) === -1) return;
          var sf = p.scraped_fields || {};
          var d = parseUsDate(sf.date);
          var t = parseDisplayTime(sf.time);
          if (!d || !t) return;
          rows.push({
            year: year, day: d.dow, date: d.iso, time: sf.time, sort_time: t,
            raw_time_range: sf.time, location: sf.location || "TBA",
            title: stripTags(p.title.rendered), presenters: sf.presenter_name || "",
            type: "", tag: "", presentation_id: p.id
          });
        });
      }
    }
    state.scheduleCache[year] = rows;
    return rows;
  }

  function mediaUrl(m, size) {
    if (!m) return null;
    var sizes = (m.media_details && m.media_details.sizes) || {};
    return (sizes[size] && sizes[size].source_url) || m.source_url || null;
  }
  function featuredUrl(item, size) {
    if (!item || !item.featured_media) return null;
    var m = state.mediaById[item.featured_media];
    return m ? mediaUrl(m, size) : null;
  }

  function dayLabel(dateStr) {
    var d = new Date(dateStr + "T12:00:00");
    return {
      dow: d.toLocaleDateString(undefined, { weekday: "short" }),
      date: d.toLocaleDateString(undefined, { month: "short", day: "numeric" })
    };
  }

  function closeAllMenus() {
    elSiteMenu.hidden = true;
    elHamburgerBtn.setAttribute("aria-expanded", "false");
    elYearMenu.hidden = true;
    elYearToggle.setAttribute("aria-expanded", "false");
  }

  function toggleMenu(btn, panel) {
    var opening = panel.hidden;
    closeAllMenus();
    if (opening) {
      panel.hidden = false;
      btn.setAttribute("aria-expanded", "true");
    }
  }

  // Dropdown, not tabs, so the year picker fits to the left of the search
  // box instead of its own row; defaults to (and reopens showing a check
  // next to) the most recent year, same as the old tabs did.
  function renderYearMenu() {
    var years = getAvailableYears();
    elYearToggleLabel.textContent = state.year;
    elYearMenu.innerHTML = "";
    if (years.length < 2) { elYearToggle.hidden = true; return; }
    elYearToggle.hidden = false;
    years.forEach(function (year) {
      var selected = state.year === year;
      var btn = document.createElement("button");
      btn.className = "year-option";
      btn.type = "button";
      btn.setAttribute("role", "option");
      btn.setAttribute("aria-selected", String(selected));
      btn.innerHTML = '<span class="check">' + (selected ? "&#10003;" : "") + '</span>' + esc(year);
      btn.addEventListener("click", function () {
        closeAllMenus();
        if (state.year === year) return;
        state.year = year;
        state.day = "all";
        state.query = "";
        elSearch.value = "";
        render();
      });
      elYearMenu.appendChild(btn);
    });
  }

  function renderDayTabs() {
    var days = Array.from(new Set(getScheduleForYear(state.year).map(function (s) { return s.date; }))).sort();
    elDayTabs.innerHTML = "";

    var allBtn = document.createElement("button");
    allBtn.className = "day-tab" + (state.day === "all" && !state.query ? " active" : "");
    allBtn.textContent = "All Days";
    allBtn.addEventListener("click", function () {
      state.day = "all";
      state.query = "";
      elSearch.value = "";
      render();
    });
    elDayTabs.appendChild(allBtn);

    days.forEach(function (date) {
      var lbl = dayLabel(date);
      var btn = document.createElement("button");
      btn.className = "day-tab" + (state.day === date && !state.query ? " active" : "");
      btn.innerHTML = '<span class="dow">' + esc(lbl.dow) + '</span>' + esc(lbl.date);
      btn.addEventListener("click", function () {
        state.day = date;
        state.query = "";
        elSearch.value = "";
        render();
      });
      elDayTabs.appendChild(btn);
    });
  }

  function typeBadge(type) {
    if (!type) return "";
    var slug = typeSlug(type);
    return '<span class="badge type-' + esc(slug) + '">' + esc(type) + '</span>';
  }

  function scheduleCard(item) {
    var card = document.createElement("button");
    card.className = "card";
    card.type = "button";
    card.innerHTML =
      '<div class="card-time">' + esc(item.time) + '</div>' +
      '<div class="card-body">' +
        '<div class="card-title">' + esc(item.title) + '</div>' +
        (item.presenters ? '<div class="card-presenter">' + esc(item.presenters) + '</div>' : '') +
        '<div class="card-meta">' +
          '<span class="badge loc">' + esc(item.location) + '</span>' +
          typeBadge(item.type) +
        '</div>' +
      '</div>';
    card.addEventListener("click", function () { openScheduleItem(item); });
    return card;
  }

  // Builds the (possibly multi-column, by-venue) tracks element for one
  // day's worth of already-sorted items. Shared by the single-day view and
  // by each section of the all-days view.
  function buildTracksElement(dayItems) {
    var byLocation = {};
    dayItems.forEach(function (it) {
      (byLocation[it.location] = byLocation[it.location] || []).push(it);
    });
    var majorTracks = Object.keys(byLocation).filter(function (loc) { return byLocation[loc].length >= 3; });

    var tracksEl = document.createElement("div");

    if (majorTracks.length >= 2) {
      tracksEl.className = "tracks multi";
      majorTracks.forEach(function (loc) {
        var col = document.createElement("div");
        col.innerHTML = '<div class="track-heading">' + esc(loc) + '</div>';
        var list = document.createElement("div");
        list.className = "track-list";
        byLocation[loc].forEach(function (it) { list.appendChild(scheduleCard(it)); });
        col.appendChild(list);
        tracksEl.appendChild(col);
      });
      var minorItems = dayItems.filter(function (it) { return majorTracks.indexOf(it.location) === -1; });
      if (minorItems.length) {
        var col2 = document.createElement("div");
        col2.innerHTML = '<div class="track-heading">Also Today</div>';
        var list2 = document.createElement("div");
        list2.className = "track-list";
        minorItems.forEach(function (it) { list2.appendChild(scheduleCard(it)); });
        col2.appendChild(list2);
        tracksEl.appendChild(col2);
      }
    } else {
      tracksEl.className = "tracks";
      var list3 = document.createElement("div");
      list3.className = "track-list";
      dayItems.forEach(function (it) { list3.appendChild(scheduleCard(it)); });
      tracksEl.appendChild(list3);
    }
    return tracksEl;
  }

  function renderSchedule() {
    elMain.innerHTML = "";

    var items = getScheduleForYear(state.year).slice();
    var query = state.query.trim().toLowerCase();

    if (query) {
      items = items.filter(function (it) {
        return (it.title + " " + it.presenters + " " + it.location).toLowerCase().indexOf(query) !== -1;
      });
      items.sort(function (a, b) { return (a.date + a.sort_time).localeCompare(b.date + b.sort_time); });

      if (!items.length) {
        elMain.innerHTML = '<div class="empty-state">No matches for &ldquo;' + esc(state.query) + '&rdquo;.</div>';
        return;
      }
      var note = document.createElement("p");
      note.className = "search-results-note";
      note.textContent = items.length + " result" + (items.length === 1 ? "" : "s") + " across the full schedule";
      elMain.appendChild(note);

      var lastDate = null;
      items.forEach(function (it) {
        if (it.date !== lastDate) {
          lastDate = it.date;
          var lbl = dayLabel(it.date);
          var h = document.createElement("div");
          h.className = "day-header";
          h.textContent = it.day + ", " + lbl.date;
          elMain.appendChild(h);
        }
        var wrap = document.createElement("div");
        wrap.className = "track-list";
        wrap.appendChild(scheduleCard(it));
        elMain.appendChild(wrap);
      });
      return;
    }

    if (!items.length) {
      elMain.innerHTML = '<div class="empty-state">No schedule published for ' + esc(state.year) + ' yet.</div>';
      return;
    }

    if (state.day === "all") {
      var allDays = Array.from(new Set(items.map(function (it) { return it.date; }))).sort();
      allDays.forEach(function (date) {
        var lbl = dayLabel(date);
        var dayItems = items.filter(function (it) { return it.date === date; })
          .sort(function (a, b) { return a.sort_time.localeCompare(b.sort_time); });
        var h = document.createElement("div");
        h.className = "day-header";
        h.textContent = dayItems[0].day + ", " + lbl.date;
        elMain.appendChild(h);
        elMain.appendChild(buildTracksElement(dayItems));
      });
      return;
    }

    var dayItems = items.filter(function (it) { return it.date === state.day; })
      .sort(function (a, b) { return a.sort_time.localeCompare(b.sort_time); });

    if (!dayItems.length) {
      elMain.innerHTML = '<div class="empty-state">Nothing scheduled yet for this day.</div>';
      return;
    }

    elMain.appendChild(buildTracksElement(dayItems));
  }

  // Real, bookmarkable/shareable URLs for anything that has one (a
  // presentation, About, Sponsor) - matches the static pages generated by
  // scripts/build_share_pages.py, which is what makes them real for SEO
  // rather than just an in-app hash. pushState never triggers a network
  // request, so this is free even though the same path also maps to a real
  // file on the server for a fresh load or a shared link.
  function navigate(url) {
    if (location.pathname !== url) history.pushState(null, "", url);
  }
  function navigateHome() {
    if (location.pathname !== "/") history.pushState(null, "", "/");
  }

  function openModal(innerHtml) {
    closeDrawer();
    elModalRoot.innerHTML =
      '<div class="modal-backdrop" id="modal-backdrop">' +
        '<div class="modal">' +
          '<button class="modal-close" id="modal-close" type="button">&times;</button>' +
          innerHtml +
        '</div>' +
      '</div>';
    var backdrop = document.getElementById("modal-backdrop");
    backdrop.addEventListener("click", function (e) { if (e.target === backdrop) closeModalToHome(); });
    document.getElementById("modal-close").addEventListener("click", closeModalToHome);
    var modalEl = backdrop.querySelector(".modal");
    rewriteContentImages(modalEl);
  }
  function closeModal() { elModalRoot.innerHTML = ""; }
  function closeModalToHome() { closeModal(); navigateHome(); }

  // Presentations (and logistics-only schedule items) open in a side drawer
  // instead of a blocking modal, so the schedule stays interactive behind
  // it - clicking another card just swaps the drawer's contents in place.
  function openDrawer(innerHtml) {
    closeModal();
    document.body.classList.add("drawer-open");
    elDrawerRoot.innerHTML =
      '<div class="drawer-backdrop" id="drawer-backdrop">' +
        '<div class="drawer">' +
          '<button class="modal-close" id="drawer-close" type="button">&times;</button>' +
          innerHtml +
        '</div>' +
      '</div>';
    var backdrop = document.getElementById("drawer-backdrop");
    backdrop.addEventListener("click", function (e) { if (e.target === backdrop) closeDrawerToHome(); });
    document.getElementById("drawer-close").addEventListener("click", closeDrawerToHome);
    var drawerEl = backdrop.querySelector(".drawer");
    rewriteContentImages(drawerEl);
  }
  function closeDrawer() {
    elDrawerRoot.innerHTML = "";
    document.body.classList.remove("drawer-open");
  }
  function closeDrawerToHome() { closeDrawer(); navigateHome(); }

  function openScheduleItem(item) {
    if (item.presentation_id) {
      var pres = (state.data.presentations || []).find(function (p) { return p.id === item.presentation_id; });
      if (pres) { openPresentation(pres); return; }
    }
    // Logistics item / no dedicated presentation page - show what the
    // schedule knows. No presentation page exists for this, so there's no
    // real URL to push - it just opens in place.
    var html = '<h2>' + esc(item.title) + '</h2>' +
      '<div class="modal-meta">' +
        '<span class="badge loc">' + esc(item.location) + '</span>' +
        typeBadge(item.type) +
      '</div>' +
      '<p style="font-size:14px;color:var(--text-muted)">' + esc(item.day) + ' &bull; ' + esc(item.raw_time_range || item.time) + '</p>' +
      (item.presenters ? '<p style="font-size:14px">' + esc(item.presenters) + '</p>' : '');
    openDrawer(html);
  }

  function openPresentation(pres) {
    var sf = pres.scraped_fields || {};
    var hero = featuredUrl(pres, "large");
    var html = "";
    if (hero) html += '<img class="modal-hero" src="' + esc(hero) + '">';
    html += '<h2>' + pres.title.rendered + '</h2>';
    html += '<div class="modal-meta">';
    if (sf.location) html += '<span class="badge loc">' + esc(sf.location) + '</span>';
    if (sf.date || sf.time) html += '<span class="badge loc">' + esc([sf.date, sf.time].filter(Boolean).join(" · ")) + '</span>';
    if (sf.type) html += typeBadge(sf.type);
    html += '</div>';

    var bioId = "bio-" + pres.id;
    if (sf.presenter_name || sf.presenter_bio) {
      html += '<div class="presenter-card">' +
        (sf.presenter_photo_url ? '<img src="' + esc(sf.presenter_photo_url) + '">' : '') +
        '<div><div class="presenter-name">' + esc(sf.presenter_name || "Presenter") + '</div>' +
        '<div class="presenter-bio collapsed" id="' + bioId + '">' + esc(sf.presenter_bio || "") + '</div>' +
        (sf.presenter_bio ? '<button class="bio-toggle" type="button" aria-expanded="false" aria-controls="' + bioId + '" hidden>Read more</button>' : '') +
        '</div></div>';
    }

    html += '<div class="wp-content">' + (pres.content && pres.content.rendered ? pres.content.rendered : "") + '</div>';
    if (pres.link) html += '<a class="live-link" href="' + esc(pres.link) + '" target="_blank" rel="noopener">View on live site &rarr;</a>';
    openDrawer(html);
    wireBioToggle(bioId);
    navigate("/p/" + pres.slug + "/");
  }

  // Only show the toggle (and only clip the bio) when the text actually
  // overflows the collapsed height - a short bio should just render plainly.
  function wireBioToggle(bioId) {
    var bio = document.getElementById(bioId);
    if (!bio) return;
    var toggle = bio.nextElementSibling;
    if (!toggle || !toggle.classList.contains("bio-toggle")) return;
    if (bio.scrollHeight - bio.clientHeight < 4) {
      bio.classList.remove("collapsed");
      return;
    }
    toggle.hidden = false;
    toggle.addEventListener("click", function () {
      var expanded = toggle.getAttribute("aria-expanded") === "true";
      bio.classList.toggle("collapsed", expanded);
      toggle.setAttribute("aria-expanded", String(!expanded));
      toggle.textContent = expanded ? "Read more" : "Show less";
    });
  }

  function openPage(page) {
    var hero = featuredUrl(page, "large");
    var html = "";
    if (hero) html += '<img class="modal-hero" src="' + esc(hero) + '">';
    html += '<h2>' + page.title.rendered + '</h2>';
    html += '<div class="wp-content">' + (page.content && page.content.rendered ? page.content.rendered : "") + '</div>';
    openModal(html);
  }

  var ABOUT_PAGE_ID = 469;
  var SPONSOR_PAGE_ID = 620;

  // Custom layout for the About page: pulls out just the intro copy and the
  // event photo gallery from the WordPress content, dropping the old
  // outbound buttons (donate/submit/past-years links) that don't apply here.
  function openAboutPage() {
    var page = (state.data.pages || []).find(function (p) { return p.id === ABOUT_PAGE_ID; });
    if (!page) return;
    var parsed = document.createElement("div");
    parsed.innerHTML = (page.content && page.content.rendered) || "";

    var paras = Array.from(parsed.querySelectorAll("p"))
      .map(function (p) { return p.innerHTML.trim(); })
      .filter(Boolean);
    var imgSrcs = Array.from(parsed.querySelectorAll("img"))
      .map(function (img) { return img.getAttribute("src"); })
      .filter(Boolean);

    var html = '<h2>' + page.title.rendered + '</h2>';
    paras.forEach(function (p) { html += '<p class="about-p">' + p + '</p>'; });
    if (imgSrcs.length) {
      html += '<div class="photo-grid">' +
        imgSrcs.map(function (src) { return '<img src="' + esc(src) + '" loading="lazy">'; }).join("") +
        '</div>';
    }
    html += '<a class="live-link" href="https://web.archive.org/web/20250821094845/https://www.nola.com/news/business/innovation/noai-new-orleans-jazz-museum-1111-philosophers-artificial-intelligence-blake-grace-bertuccelli-booth/article_3eddfcb0-9acd-11ef-97c3-1bbd0c95b721.html" target="_blank" rel="noopener">Read the Times-Picayune feature &rarr;</a>';
    openModal(html);
    navigate("/about/");
  }

  function openSponsorPage() {
    var page = (state.data.pages || []).find(function (p) { return p.id === SPONSOR_PAGE_ID; });
    if (page) openPage(page);
    navigate("/sponsor/");
  }

  // Rewrites "#presentation/<slug>" links baked into page content HTML into
  // in-app navigation, opening that presentation's modal instead of a dead anchor.
  function rewriteContentLinksIn(root) {
    root.querySelectorAll('a[href^="#presentation/"]').forEach(function (a) {
      a.addEventListener("click", function (e) {
        e.preventDefault();
        var slug = a.getAttribute("href").slice("#presentation/".length);
        var pres = (state.data.presentations || []).find(function (p) { return p.slug === slug; });
        if (pres) openPresentation(pres);
      });
    });
  }

  // Standalone static hosting has no cross-origin image restriction, so this
  // is a no-op passthrough kept only so content HTML's <img src> already
  // works without further rewriting.
  function rewriteContentImages(root) {
    rewriteContentLinksIn(root);
  }

  function render() {
    renderYearMenu();
    renderDayTabs();
    renderSchedule();
  }

  elSearch.addEventListener("input", function () {
    state.query = elSearch.value;
    renderDayTabs();
    renderSchedule();
  });

  elHamburgerBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    toggleMenu(elHamburgerBtn, elSiteMenu);
  });
  elYearToggle.addEventListener("click", function (e) {
    e.stopPropagation();
    toggleMenu(elYearToggle, elYearMenu);
  });
  elSiteMenu.addEventListener("click", function (e) {
    var btn = e.target.closest("[data-menu]");
    if (!btn) return;
    var which = btn.dataset.menu;
    closeAllMenus();
    if (which === "schedule") {
      closeModal();
      closeDrawer();
      navigateHome();
      state.day = "all";
      state.query = "";
      elSearch.value = "";
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    } else if (which === "about") {
      openAboutPage();
    } else if (which === "sponsor") {
      openSponsorPage();
    }
  });
  document.addEventListener("click", function (e) {
    if (!elSiteMenu.hidden && !elSiteMenu.contains(e.target)) closeAllMenus();
    if (!elYearMenu.hidden && !elYearMenu.contains(e.target)) closeAllMenus();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      closeModalToHome();
      closeDrawerToHome();
      closeAllMenus();
    }
  });

  // Picks a fresh favicon (and, cosmetically, a fresh og:image tag in this
  // document) on every load, from whatever icon-*/ogg-* files the harvest's
  // media manifest currently lists - so it keeps rotating as more get added,
  // no code change needed. Note this can't make *shared-link* previews
  // change per click: social crawlers read the static og:image already
  // baked into the HTML they fetch and never run this script.
  function rotateSiteImages(images) {
    var icons = (images && images.icons) || [];
    var ogg = (images && images.ogg) || [];
    if (icons.length) {
      document.getElementById("site-favicon").href = icons[Math.floor(Math.random() * icons.length)];
    }
    if (ogg.length) {
      var pick = location.origin + "/" + ogg[Math.floor(Math.random() * ogg.length)];
      ["meta[property='og:image']", "meta[name='twitter:image']"].forEach(function (sel) {
        var el = document.querySelector(sel);
        if (el) el.setAttribute("content", pick);
      });
    }
  }

  // Opens whatever the current URL points at - the presentation/about/
  // sponsor pages generated by scripts/build_share_pages.py are full
  // copies of this same app, so landing on /p/<slug>/ (a fresh load, a
  // shared link, or the back/forward buttons) just needs this app to
  // notice where it is and open the right thing; it never has to redirect.
  // The #presentation/<slug> form is only kept as a fallback for links
  // shared before real per-item URLs existed.
  function openFromLocation() {
    var path = location.pathname;
    var m = /^\/p\/([^/]+)\/?$/.exec(path);
    if (m) {
      var pres = (state.data.presentations || []).find(function (p) { return p.slug === decodeURIComponent(m[1]); });
      if (pres) { openPresentation(pres); return; }
    }
    if (/^\/about\/?$/.test(path)) { openAboutPage(); return; }
    if (/^\/sponsor\/?$/.test(path)) { openSponsorPage(); return; }

    var hm = /^#presentation\/(.+)$/.exec(location.hash);
    if (hm) {
      var pres2 = (state.data.presentations || []).find(function (p) { return p.slug === decodeURIComponent(hm[1]); });
      if (pres2) { openPresentation(pres2); return; }
    }
    if (location.hash === "#about") { openAboutPage(); return; }
    if (location.hash === "#sponsor") { openSponsorPage(); return; }
  }

  window.addEventListener("popstate", function () {
    closeModal();
    closeDrawer();
    openFromLocation();
  });

  fetch("content.json")
    .then(function (r) { return r.json(); })
    .then(function (data) {
      state.data = data;
      (data.media || []).forEach(function (m) { state.mediaById[m.id] = m; });
      rotateSiteImages(data.site_images);
      render();
      openFromLocation();
    })
    .catch(function (err) {
      elMain.innerHTML = '<div class="empty-state">Couldn&rsquo;t load the schedule.<br>' + esc(err.message) + '</div>';
    });
})();
</script>
</body>
</html>
