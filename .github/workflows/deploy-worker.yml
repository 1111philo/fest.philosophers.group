# Deploys the registration Worker (cloudflare-worker/) to Cloudflare whenever
# it changes on main - the same way deploy.yml publishes the site. Can also
# be run by hand from the Actions tab.
#
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (an "Edit Cloudflare
# Workers" token) and CLOUDFLARE_ACCOUNT_ID. The Worker's own secrets
# (STRIPE_SECRET_KEY, ADMIN_KEY) live in Cloudflare and are untouched by a
# deploy.
name: Deploy registration Worker

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-worker
          command: deploy
